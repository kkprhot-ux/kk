name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  pc-tests:
    name: PC backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd pc_service
          pip install -r requirements.txt
      - name: Run tests with coverage
        run: |
          cd pc_service
          pytest -v --tb=short \
            --cov=server --cov=storage --cov=analyzer \
            --cov-report=term-missing \
            --cov-report=xml

  flutter-tests:
    name: Flutter widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.27.0"
      - name: Install dependencies
        run: cd phone_app && flutter pub get
      - name: Run tests
        run: cd phone_app && flutter test
      - name: Analyze
        run: cd phone_app && flutter analyze --no-pub
