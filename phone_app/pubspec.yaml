name: phone_app
description: "Real-time sales assistant: listens to live conversation, pushes AI suggestions. v2.1 (in-person sales mode)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # UI icons
  cupertino_icons: ^1.0.8

  # Real-time audio + push
  web_socket_channel: ^2.4.0
  flutter_sound: ^9.4.0

  # Permissions and storage
  permission_handler: ^11.0.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # History API
  http: ^1.2.0

  # VAD is implemented in-house (PCM16 energy threshold) — no external package needed.
  # phone_state removed: in-person sales does not need call-state monitoring.
  # flutter_sound uses defaultSource microphone (Android disallows recording
  # call audio for third-party apps, so we capture the in-person conversation
  # via the device mic instead).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
